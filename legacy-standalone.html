    function categorizeQuestion(questionObj) {
      const combinedText = [
        questionObj.question || '',
        (questionObj.options || []).map(o => o.text || o).join(' '),
        questionObj.explanation || '',
      ].join(' ').toLowerCase();

      const scores = {};
      for (const catId of Object.keys(TOPIC_KEYWORDS)) {
        scores[catId] = 0;
      }

      for (const [catId, keywords] of Object.entries(TOPIC_KEYWORDS)) {
        for (const { term, weight } of keywords) {
          const escaped = term.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
          const regex = new RegExp(`\\b${escaped}\\b`, 'gi');
          const matches = combinedText.match(regex);
          if (matches) {
            scores[catId] += matches.length * weight;
          }
        }
      }

      let bestCategory = 'config_setup';
      let maxScore = -1;

      for (const [catId, score] of Object.entries(scores)) {
        if (score > maxScore) {
          maxScore = score;
          bestCategory = catId;
        }
      }

      if (maxScore === 0) {
        if (combinedText.includes('flow') || combinedText.includes('trigger')) return 'automation';
        if (combinedText.includes('report') || combinedText.includes('data')) return 'data_analytics';
        if (combinedText.includes('case') || combinedText.includes('support')) return 'service_support';
        if (combinedText.includes('opportunity') || combinedText.includes('lead')) return 'sales_marketing';
        if (combinedText.includes('object') || combinedText.includes('field') || combinedText.includes('layout')) return 'object_manager';
        return 'config_setup';
      }

      return bestCategory;
    }

    // --- 3. QUESTION PARSER ---
    function parseQuestionsFromText(rawText) {
      if (!rawText || typeof rawText !== 'string') return [];

      const cleanText = rawText.replace(/\r\n/g, '\n').replace(/\r/g, '\n');
      const lines = cleanText.split('\n');
      const blocks = [];
      let currentBlockLines = [];

      const questionHeaderRegex = /^(\s*#{1,4}\s*)?(\bQuestion\s+)?(\d+)[\.\)\:]\s+/i;

      for (let i = 0; i < lines.length; i++) {
        const line = lines[i];
        if (questionHeaderRegex.test(line)) {
          if (currentBlockLines.length > 0) {
            blocks.push(currentBlockLines.join('\n'));
            currentBlockLines = [];
          }
        }
        currentBlockLines.push(line);
      }

      if (currentBlockLines.length > 0) {
        blocks.push(currentBlockLines.join('\n'));
      }

      const parsedQuestions = [];

      for (let bIndex = 0; bIndex < blocks.length; bIndex++) {
        const block = blocks[bIndex].trim();
        if (!block) continue;

        const linesArr = block.split('\n').map(l => l.trim()).filter(Boolean);
        if (linesArr.length < 2) continue;

        let questionText = '';
        const options = [];
        let rawAnswer = '';
        let explanation = '';
        let state = 'QUESTION';

        const optionRegex = /^([A-H])[\.\)\:\s\]]\s*(.*)$/i;
        const answerRegex = /^(?:Answer(?:\(s\))?|Correct Answer|ANS)\s*[:\-]\s*(.*)$/i;
        const explanationRegex = /^(?:Why|Explanation|Rationale|Notes?)\s*[:\-]\s*(.*)$/i;
        const timestampRegex = /^Timestamp\s*:/i;

        for (let j = 0; j < linesArr.length; j++) {
          const line = linesArr[j];
          if (timestampRegex.test(line)) continue;

          if (answerRegex.test(line)) {
            state = 'ANSWER';
            const m = line.match(answerRegex);
            rawAnswer = m ? m[1].trim() : '';
            continue;
          }

          if (explanationRegex.test(line)) {
            state = 'EXPLANATION';
            const m = line.match(explanationRegex);
            explanation = m ? m[1].trim() : '';
            continue;
          }

          if (state === 'QUESTION') {
            if (optionRegex.test(line)) {
              state = 'OPTIONS';
              const m = line.match(optionRegex);
              options.push({ letter: m[1].toUpperCase(), text: m[2].trim() });
            } else {
              questionText += (questionText ? ' ' : '') + line;
            }
          } else if (state === 'OPTIONS') {
            if (optionRegex.test(line)) {
              const m = line.match(optionRegex);
              options.push({ letter: m[1].toUpperCase(), text: m[2].trim() });
            } else if (state !== 'ANSWER' && state !== 'EXPLANATION') {
              if (options.length > 0) {
                options[options.length - 1].text += ' ' + line;
              }
            }
          } else if (state === 'ANSWER') {
            if (explanationRegex.test(line)) {
              state = 'EXPLANATION';
              const m = line.match(explanationRegex);
              explanation = m ? m[1].trim() : '';
            } else {
              rawAnswer += ' ' + line;
            }
          } else if (state === 'EXPLANATION') {
            explanation += (explanation ? ' ' : '') + line;
          }
        }

        const cleanQuestion = questionText.replace(/^(\s*#{1,4}\s*)?(\bQuestion\s+)?(\d+)[\.\)\:]\s*/i, '').trim();

        if (!cleanQuestion || options.length < 2) continue;

        // Extract option letters
        const validLetters = new Set(options.map(o => o.letter.toUpperCase()));
        const correctLetters = [];
        const matches = (rawAnswer || '').match(/\b[A-H]\b/gi);
        if (matches) {
          for (const m of matches) {
            const letter = m.toUpperCase();
            if (validLetters.has(letter) && !correctLetters.includes(letter)) {
              correctLetters.push(letter);
            }
          }
        }
        if (correctLetters.length === 0) {
          const chars = (rawAnswer || '').replace(/[^A-Ha-h]/g, '').toUpperCase().split('');
          for (const c of chars) {
            if (validLetters.has(c) && !correctLetters.includes(c)) {
              correctLetters.push(c);
            }
          }
        }
        if (correctLetters.length === 0) {
          correctLetters.push(options[0].letter);
        }

        correctLetters.sort();

        const isMulti = correctLetters.length > 1 || 
          /\(choose\s+(two|three|2|3)\)/i.test(cleanQuestion) || 
          /\(select\s+(all|two|three|2|3)\)/i.test(cleanQuestion);

        const parsedObj = {
          id: `q_file_${bIndex + 1}_${Math.random().toString(36).substr(2, 6)}`,
          originalNumber: bIndex + 1,
          question: cleanQuestion,
          options,
          correctLetters,
          rawAnswer,
          explanation: explanation.trim() || 'No specific explanation provided in source.',
          isMultiSelect: isMulti,
          requiredSelectionCount: correctLetters.length > 1 ? correctLetters.length : (/\(choose\s+three|3\)/i.test(cleanQuestion) ? 3 : (/\(choose\s+two|2\)/i.test(cleanQuestion) ? 2 : 1)),
          source: 'file',
        };

        parsedObj.categoryId = categorizeQuestion(parsedObj);
        parsedQuestions.push(parsedObj);
      }

      return parsedQuestions;
    }

    function buildBalancedExamSet(parsedQuestions, topicList) {
      const categoryPools = {};
      const breakdown = {};

      for (const topic of topicList) {
        categoryPools[topic.id] = { fileQuestions: [], generatedQuestions: [] };
      }

      for (const q of parsedQuestions) {
        const catId = q.categoryId || 'config_setup';
        if (categoryPools[catId]) {
          categoryPools[catId].fileQuestions.push(q);
        } else {
          categoryPools['config_setup'].fileQuestions.push(q);
        }
      }

      const selectedQuestions = [];

      for (const topic of topicList) {
        const catId = topic.id;
        const targetCount = topic.targetCount;
        const pool = categoryPools[catId];

        const shuffledFile = [...pool.fileQuestions].sort(() => 0.5 - Math.random());
        const filePicked = shuffledFile.slice(0, targetCount);

        let genPicked = [];
        const shortfall = targetCount - filePicked.length;

        if (shortfall > 0) {
          const fallbacks = FALLBACK_BANK[catId] || [];
          const shuffledFallbacks = [...fallbacks].sort(() => 0.5 - Math.random());

          for (let i = 0; i < shortfall; i++) {
            const base = shuffledFallbacks[i % shuffledFallbacks.length] || {
              question: `[Generated] Which feature in Salesforce is recommended for configuring standard ${topic.name} requirements?`,
              options: [
                { letter: "A", text: "Standard Setup and Declarative App Builder" },
                { letter: "B", text: "Direct SQL Database Queries" },
                { letter: "C", text: "Custom Javascript on Classic Pages" },
                { letter: "D", text: "Manual Data Synchronization" }
              ],
              correctLetters: ["A"],
              explanation: "Salesforce emphasizes declarative point-and-click tools in Setup to handle administrative requirements.",
              isMultiSelect: false,
              requiredSelectionCount: 1,
              source: "generated",
              categoryId: catId,
            };

            genPicked.push({
              ...base,
              id: `q_gen_${catId}_${i}_${Math.random().toString(36).substr(2, 6)}`,
              source: 'generated',
            });
          }
        }

        const combinedCategorySelection = [...filePicked, ...genPicked];
        selectedQuestions.push(...combinedCategorySelection);

        breakdown[catId] = {
          categoryId: catId,
          name: topic.name,
          targetCount,
          fileCount: filePicked.length,
          generatedCount: genPicked.length,
          totalCount: combinedCategorySelection.length,
          totalFileAvailable: pool.fileQuestions.length,
        };
      }

      const finalizedExamSet = selectedQuestions.sort(() => 0.5 - Math.random());

      return { examQuestions: finalizedExamSet, breakdown };
    }

    // --- 5. DETERMINISTIC GRADING ENGINE ---
    function gradeExamSession(examQuestions, userAnswers) {
      let rawCorrectCount = 0;
      const incorrectQuestions = [];
      const correctQuestions = [];
      const generatedQuestions = [];

      const categoryStats = {};
      for (const topic of TOPIC_LIST) {
        categoryStats[topic.id] = {
          id: topic.id,
          name: topic.name,
          total: 0,
          correct: 0,
          percentage: 0,
        };
      }

      examQuestions.forEach((q, index) => {
        const qId = q.id;
        const userSelected = (userAnswers[qId] || []).map(l => l.toUpperCase()).sort();
        const correctSelected = (q.correctLetters || []).map(l => l.toUpperCase()).sort();

        const isCorrect = 
          userSelected.length === correctSelected.length &&
          userSelected.every(letter => correctSelected.includes(letter));

        const resultRecord = {
          examIndex: index + 1,
          id: q.id,
          question: q.question,
          options: q.options,
          userAnswers: userSelected,
          userAnswerString: userSelected.length > 0 ? userSelected.join(', ') : 'No answer recorded',
          correctLetters: correctSelected,
          correctAnswerString: correctSelected.join(', '),
          explanation: q.explanation || 'No explanation provided.',
          categoryId: q.categoryId,
          source: q.source || 'file',
          isCorrect,
        };

        const catId = q.categoryId;
        if (categoryStats[catId]) {
          categoryStats[catId].total += 1;
          if (isCorrect) categoryStats[catId].correct += 1;
        }

        if (isCorrect) {
          rawCorrectCount += 1;
          correctQuestions.push(resultRecord);
        } else {
          incorrectQuestions.push(resultRecord);
        }

        if (q.source === 'generated') {
          generatedQuestions.push(resultRecord);
        }
      });

      for (const catId of Object.keys(categoryStats)) {
        const stat = categoryStats[catId];
        stat.percentage = stat.total > 0 ? Math.round((stat.correct / stat.total) * 100) : 0;
      }

      const totalQuestions = examQuestions.length || EXAM_CONFIG.TOTAL_QUESTIONS;
      const scorePercent = Number(((rawCorrectCount / totalQuestions) * 100).toFixed(1));
      const isPassed = scorePercent >= EXAM_CONFIG.PASSING_SCORE_PERCENT;

      return {
        scorePercent,
        rawCorrectCount,
        totalQuestions,
        isPassed,
        passingThresholdPercent: EXAM_CONFIG.PASSING_SCORE_PERCENT,
        minPassingCount: EXAM_CONFIG.MIN_PASSING_SCORE,
        incorrectQuestions,
        correctQuestions,
        generatedQuestions,
        categoryStats: Object.values(categoryStats),
      };
    }

    // --- 6. REACT CONTEXT & STATE MANAGEMENT ---
    const ExamContext = createContext(null);

    function ExamProvider({ children }) {
      const [examState, setExamState] = useState(EXAM_STATES.NOT_STARTED);
      const [isParsing, setIsParsing] = useState(false);
      const [parseError, setParseError] = useState(null);

      const [allParsedQuestions, setAllParsedQuestions] = useState([]);
      const [examQuestions, setExamQuestions] = useState([]);
      const [categoryBreakdown, setCategoryBreakdown] = useState({});

      const [currentQuestionIndex, setCurrentQuestionIndex] = useState(0);
      const [userAnswers, setUserAnswers] = useState({});
      const [timeRemaining, setTimeRemaining] = useState(EXAM_CONFIG.TIME_LIMIT_SECONDS);
      const [pauseUsed, setPauseUsed] = useState(false);
      const [examResults, setExamResults] = useState(null);

      const timerRef = useRef(null);

      const finalizeExamSubmission = useCallback(() => {
        if (timerRef.current) clearInterval(timerRef.current);
        const results = gradeExamSession(examQuestions, userAnswers);
        setExamResults(results);
        setExamState(EXAM_STATES.COMPLETED);
      }, [examQuestions, userAnswers]);

      // Timer effect
      useEffect(() => {
        if (examState === EXAM_STATES.IN_PROGRESS) {
          timerRef.current = setInterval(() => {
            setTimeRemaining((prev) => {
              if (prev <= 1) {
                clearInterval(timerRef.current);
                finalizeExamSubmission();
                return 0;
              }
              return prev - 1;
            });
          }, 1000);
        } else {
          if (timerRef.current) clearInterval(timerRef.current);
        }
        return () => {
          if (timerRef.current) clearInterval(timerRef.current);
        };
      }, [examState, finalizeExamSubmission]);

      const loadFileContent = useCallback((rawText) => {
        try {
          setIsParsing(true);
          setParseError(null);

          setTimeout(() => {
            const parsed = parseQuestionsFromText(rawText);
            if (!parsed || parsed.length === 0) {
              setParseError("Could not detect any valid questions. Please ensure the file contains numbered questions and option choices.");
              setIsParsing(false);
              return;
            }

            setAllParsedQuestions(parsed);
            const { examQuestions: balancedSet, breakdown } = buildBalancedExamSet(parsed, TOPIC_LIST);

            setExamQuestions(balancedSet);
            setCategoryBreakdown(breakdown);
            setUserAnswers({});
            setCurrentQuestionIndex(0);
            setTimeRemaining(EXAM_CONFIG.TIME_LIMIT_SECONDS);
            setPauseUsed(false);
            setExamResults(null);
            setIsParsing(false);
            setExamState(EXAM_STATES.CONFIRMED);
          }, 50);
        } catch (err) {
          setParseError(err.message || "Failed to parse question file.");
          setIsParsing(false);
        }
      }, []);

      const confirmAndStartExam = () => {
        if (examQuestions.length > 0) {
          setExamState(EXAM_STATES.IN_PROGRESS);
        }
      };

      const selectOption = (questionId, optionLetter, isMultiSelect) => {
        setUserAnswers((prev) => {
          const currentSelected = prev[questionId] || [];
          let nextSelected;
          if (isMultiSelect) {
            if (currentSelected.includes(optionLetter)) {
              nextSelected = currentSelected.filter((l) => l !== optionLetter);
            } else {
              nextSelected = [...currentSelected, optionLetter].sort();
            }
          } else {
            nextSelected = [optionLetter];
          }
          return { ...prev, [questionId]: nextSelected };
        });
      };

      const goToNextQuestion = () => {
        if (currentQuestionIndex < examQuestions.length - 1) {
          setCurrentQuestionIndex((prev) => prev + 1);
        } else {
          finalizeExamSubmission();
        }
      };

      const pauseExam = () => {
        if (pauseUsed || examState !== EXAM_STATES.IN_PROGRESS) return;
        setPauseUsed(true);
        setExamState(EXAM_STATES.PAUSED);
      };

      const resumeExam = () => {
        if (examState === EXAM_STATES.PAUSED) {
          setExamState(EXAM_STATES.IN_PROGRESS);
        }
      };

      const restartExamWithSamePool = () => {
        const { examQuestions: newSet, breakdown } = buildBalancedExamSet(allParsedQuestions, TOPIC_LIST);
        setExamQuestions(newSet);
        setCategoryBreakdown(breakdown);
        setUserAnswers({});
        setCurrentQuestionIndex(0);
        setTimeRemaining(EXAM_CONFIG.TIME_LIMIT_SECONDS);
        setPauseUsed(false);
        setExamResults(null);
        setExamState(EXAM_STATES.CONFIRMED);
      };

      const resetToUploadScreen = () => {
        if (timerRef.current) clearInterval(timerRef.current);
        setExamState(EXAM_STATES.NOT_STARTED);
        setExamQuestions([]);
        setAllParsedQuestions([]);
        setUserAnswers({});
        setCurrentQuestionIndex(0);
        setTimeRemaining(EXAM_CONFIG.TIME_LIMIT_SECONDS);
        setPauseUsed(false);
        setExamResults(null);
      };

      const value = {
        examState,
        isParsing,
        parseError,
        allParsedQuestions,
        examQuestions,
        categoryBreakdown,
        currentQuestionIndex,
        userAnswers,
        timeRemaining,
        pauseUsed,
        examResults,
        loadFileContent,
        confirmAndStartExam,
        selectOption,
        goToNextQuestion,
        pauseExam,
        resumeExam,
        finalizeExamSubmission,
        restartExamWithSamePool,
        resetToUploadScreen,
      };

      return <ExamContext.Provider value={value}>{children}</ExamContext.Provider>;
    }

    function useExam() {
      return useContext(ExamContext);
    }

                  <span>Begin 60-Question Exam</span>

    function ExamScreen() {
      const {
        examQuestions,
        currentQuestionIndex,
        userAnswers,
        timeRemaining,
        pauseUsed,
        selectOption,
        goToNextQuestion,
        pauseExam,
      } = useExam();

      const currentQuestion = examQuestions[currentQuestionIndex];
      if (!currentQuestion) return null;

      const totalQuestions = examQuestions.length;
      const isLastQuestion = currentQuestionIndex === totalQuestions - 1;
      const selectedLetters = userAnswers[currentQuestion.id] || [];

      const formatTime = (seconds) => {
        const mins = Math.floor(seconds / 60);
        const secs = seconds % 60;
        return `${String(mins).padStart(2, '0')}:${String(secs).padStart(2, '0')}`;
      };

      const topicCategory = Object.values(TOPIC_CATEGORIES).find(
        (c) => c.id === currentQuestion.categoryId
      );
      const categoryName = topicCategory ? topicCategory.name : 'General Administration';

      const isMulti = currentQuestion.isMultiSelect;
      const requiredCount = currentQuestion.requiredSelectionCount || 1;

      return (
        <div className="max-w-4xl mx-auto p-4 md:p-6 select-none">
          <div className="bg-white rounded-2xl shadow-xl border border-slate-200 overflow-hidden">
            {/* Procedural Header */}
            <div className="bg-slate-900 text-white px-6 py-4 border-b border-slate-800 flex items-center justify-between">
              <div className="flex items-center gap-3">
                <span className="text-xs font-semibold uppercase tracking-wider text-slate-400">
                  Exam in Progress
                </span>
                <span className="text-slate-600">|</span>
                <span className="text-sm font-bold text-white font-mono">
                  Question {currentQuestionIndex + 1} of {totalQuestions}
                </span>
              </div>

              <div className="flex items-center gap-4">
                <div className={`flex items-center gap-2 px-3.5 py-1.5 rounded-lg font-mono text-sm font-bold ${
                  timeRemaining < 300 ? 'bg-red-500/20 text-red-400 border border-red-500/30' : 'bg-slate-800 text-slate-200 border border-slate-700'
                }`}>
                  <svg className="w-4 h-4 text-slate-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z" />
                  </svg>
                  <span>Time remaining: {formatTime(timeRemaining)}</span>
                </div>

                <button
                  type="button"
                  onClick={pauseExam}
                  disabled={pauseUsed}
                  className={`text-xs px-3.5 py-1.5 rounded-lg font-semibold border transition ${
                    pauseUsed
                      ? 'bg-slate-800 text-slate-500 border-slate-800 cursor-not-allowed opacity-50'
                      : 'bg-slate-800 text-slate-200 border-slate-700 hover:bg-slate-700 hover:text-white'
                  }`}
                >
                  {pauseUsed ? 'Pause (Used)' : 'Pause (1 left)'}
                </button>
              </div>
            </div>

            {/* Question Details */}
            <div className="p-6 md:p-10">
              <div className="flex flex-wrap items-center justify-between gap-2 mb-4 pb-3 border-b border-slate-100">
                <span className="text-[11px] font-bold text-blue-700 bg-blue-50 px-3 py-1 rounded-md border border-blue-200 uppercase tracking-wide">
                  {categoryName}
                </span>
                <span className="text-xs font-bold text-slate-500 uppercase tracking-wider">
                  {isMulti ? `Choose ${requiredCount > 1 ? requiredCount : 'multiple'} options` : 'Choose 1 option'}
                </span>
              </div>

              <div className="text-base md:text-lg font-semibold text-slate-900 leading-relaxed mb-8">
                {currentQuestion.question}
              </div>

              {/* Options */}
              <div className="space-y-3 mb-8">
                {currentQuestion.options.map((opt) => {
                  const isSelected = selectedLetters.includes(opt.letter);

                  return (
                    <div
                      key={opt.letter}
                      onClick={() => selectOption(currentQuestion.id, opt.letter, isMulti)}
                      className={`p-4 rounded-xl border-2 cursor-pointer transition flex items-start gap-4 ${
                        isSelected
                          ? 'border-blue-600 bg-blue-50/50 shadow-sm'
                          : 'border-slate-200 hover:border-slate-300 bg-white'
                      }`}
                    >
                      <div className="pt-0.5">
                        {isMulti ? (
                          <div className={`w-5 h-5 rounded border flex items-center justify-center transition ${
                            isSelected ? 'bg-blue-600 border-blue-600 text-white' : 'border-slate-400 bg-white'
                          }`}>
                            {isSelected && (
                              <svg className="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="3" d="M5 13l4 4L19 7" />
                              </svg>
                            )}
                          </div>
                        ) : (
                          <div className={`w-5 h-5 rounded-full border-2 flex items-center justify-center transition ${
                            isSelected ? 'border-blue-600 bg-white' : 'border-slate-400 bg-white'
                          }`}>
                            {isSelected && <div className="w-2.5 h-2.5 rounded-full bg-blue-600"></div>}
                          </div>
                        )}
                      </div>

                      <div className="flex-1">
                        <span className="text-xs font-bold text-slate-500 uppercase mr-2 font-mono">{opt.letter}.</span>
                        <span className={`text-sm leading-normal ${isSelected ? 'text-slate-900 font-bold' : 'text-slate-700'}`}>
                          {opt.text}
                        </span>
                      </div>
                    </div>
                  );
                })}
              </div>

              {/* Footer */}
              <div className="flex items-center justify-between pt-6 border-t border-slate-200">
                <div className="text-xs text-slate-400">
                  {selectedLetters.length > 0 ? (
                    <span className="text-slate-700 font-bold font-mono">Recorded: {selectedLetters.join(', ')}</span>
                  ) : (
                    <span className="text-amber-600 font-medium">No selection recorded</span>
                  )}
                </div>

                <button
                  type="button"
                  onClick={goToNextQuestion}
                  className="px-7 py-3 bg-blue-600 text-white text-xs font-bold uppercase tracking-wider rounded-xl hover:bg-blue-700 transition shadow-md flex items-center gap-2"
                >
                  <span>{isLastQuestion ? 'Submit Examination' : 'Next Question'}</span>
                  <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M13 7l5 5m0 0l-5 5m5-5H6" />
                  </svg>
                </button>
              </div>
            </div>
          </div>
        </div>
      );
    }

    function PauseScreen() {
      const { resumeExam } = useExam();

      return (
        <div className="fixed inset-0 z-50 bg-slate-900/80 backdrop-blur-sm flex items-center justify-center p-4">
          <div className="bg-white rounded-2xl shadow-2xl border border-slate-200 max-w-md w-full p-8 text-center animate-in fade-in zoom-in duration-150">
            <div className="inline-flex items-center justify-center w-14 h-14 rounded-2xl bg-amber-100 text-amber-700 mb-4 border border-amber-200">
              <svg className="w-7 h-7" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M10 9v6m4-6v6m7-3a9 9 0 11-18 0 9 9 0 0118 0z" />
              </svg>
            </div>

            <h2 className="text-xl font-bold text-slate-900 tracking-tight">Examination Paused</h2>

            <div className="bg-amber-50 border border-amber-200 rounded-xl p-3.5 my-4 text-xs text-amber-900 text-left space-y-1">
              <p className="font-bold">Single-Pause Policy Notice</p>
              <p className="text-amber-800">
                The single permitted pause for this session has been utilized. Resuming will restart the timer and lock any subsequent pauses.
              </p>
            </div>

            <p className="text-xs text-slate-500 mb-6">
              Timer is frozen. When ready, click below to return to your current question.
            </p>

            <button
              type="button"
              onClick={resumeExam}
              className="w-full py-3.5 bg-blue-600 hover:bg-blue-700 text-white text-xs font-bold uppercase tracking-wider rounded-xl transition shadow-lg shadow-blue-500/20 flex items-center justify-center gap-2"
            >
              <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M14.752 11.168l-3.197-2.132A1 1 0 0010 9.87v4.263a1 1 0 001.555.832l3.197-2.132a1 1 0 000-1.664z" />
                <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
              </svg>
              <span>Resume Examination</span>
            </button>
          </div>
        </div>
      );
    }

    function ResultsScreen() {
      const { examResults, restartExamWithSamePool, resetToUploadScreen } = useExam();
      const [activeTab, setActiveTab] = useState('incorrect');

      if (!examResults) return null;

      const {
        scorePercent,
        rawCorrectCount,
        totalQuestions,
        isPassed,
        passingThresholdPercent,
        minPassingCount,
        incorrectQuestions,
        correctQuestions,
        generatedQuestions,
        categoryStats,
      } = examResults;

      return (
        <div className="max-w-5xl mx-auto p-4 md:p-6 space-y-6">
          {/* Banner */}
          <div className={`rounded-2xl shadow-xl border p-6 md:p-8 text-white ${
            isPassed
              ? 'bg-gradient-to-r from-emerald-800 to-teal-900 border-emerald-700'
              : 'bg-gradient-to-r from-rose-900 to-red-950 border-rose-800'
          }`}>
            <div className="flex flex-col md:flex-row md:items-center justify-between gap-6">
              <div>
                <span className={`inline-block px-3 py-1 rounded-md text-xs font-extrabold uppercase tracking-wider mb-2 ${
                  isPassed ? 'bg-emerald-500/30 text-emerald-200 border border-emerald-400/40' : 'bg-red-500/30 text-red-200 border border-red-400/40'
                }`}>
                  {isPassed ? 'Official Result: Passed' : 'Official Result: Failed'}
                </span>
                <h1 className="text-2xl md:text-3xl font-extrabold tracking-tight">
                  ADM-201 Proctor Performance Report
                </h1>
                <p className="text-xs text-slate-300 mt-1">
                  Required: {passingThresholdPercent}% ({minPassingCount} of {totalQuestions} correct)
                </p>
              </div>

              <div className="flex items-center gap-6 bg-white/10 backdrop-blur-md p-4 rounded-2xl border border-white/15">
                <div className="text-right">
                  <span className="text-[10px] uppercase tracking-wider text-slate-300 font-bold block">Final Score</span>
                  <span className="text-3xl md:text-4xl font-extrabold font-mono text-white">{scorePercent}%</span>
                </div>
                <div className="h-10 w-[1px] bg-white/20"></div>
                <div>
                  <span className="text-[10px] uppercase tracking-wider text-slate-300 font-bold block">Score Count</span>
                  <span className="text-xl font-bold font-mono text-white">{rawCorrectCount} / {totalQuestions}</span>
                </div>
              </div>
            </div>

            <div className="mt-6 pt-4 border-t border-white/15 flex flex-wrap items-center justify-between gap-3">
              <div className="text-xs text-slate-300">
                Exam session deterministically graded according to official Salesforce blueprint.
              </div>
              <div className="flex items-center gap-3">
                <button
                  onClick={restartExamWithSamePool}
                  className="px-4 py-2 bg-white/20 hover:bg-white/30 text-white rounded-lg text-xs font-bold transition border border-white/20"

                  Retake Exam (New 60 Sample)
                </button>
                <button
                  onClick={resetToUploadScreen}
                  className="px-4 py-2 bg-white text-slate-900 hover:bg-slate-100 rounded-lg text-xs font-bold transition shadow"
                >

            </div>
          </div>

          {/* Tab Navigation */}
          <div className="bg-white rounded-2xl shadow-lg border border-slate-200 overflow-hidden">
            <div className="flex border-b border-slate-200 bg-slate-50 text-xs font-bold overflow-x-auto">
              <button
                onClick={() => setActiveTab('incorrect')}
                className={`px-5 py-3.5 border-b-2 transition whitespace-nowrap flex items-center gap-2 ${
                  activeTab === 'incorrect' ? 'border-red-600 text-red-600 bg-white' : 'border-transparent text-slate-600 hover:text-slate-900'
                }`}
              >
                <span>Incorrect Answers</span>
                <span className="px-2 py-0.5 rounded-full text-[10px] bg-red-100 text-red-800 font-extrabold">
                  {incorrectQuestions.length}
                </span>
              </button>

              <button
                onClick={() => setActiveTab('correct')}
                className={`px-5 py-3.5 border-b-2 transition whitespace-nowrap flex items-center gap-2 ${
                  activeTab === 'correct' ? 'border-emerald-600 text-emerald-600 bg-white' : 'border-transparent text-slate-600 hover:text-slate-900'
                }`}
              >
                <span>Correct Answers</span>
                <span className="px-2 py-0.5 rounded-full text-[10px] bg-emerald-100 text-emerald-800 font-extrabold">
                  {correctQuestions.length}
                </span>
              </button>

              <button
                onClick={() => setActiveTab('categories')}
                className={`px-5 py-3.5 border-b-2 transition whitespace-nowrap flex items-center gap-2 ${
                  activeTab === 'categories' ? 'border-blue-600 text-blue-600 bg-white' : 'border-transparent text-slate-600 hover:text-slate-900'
                }`}
              >
                <span>Topic Blueprint Breakdown</span>
              </button>

              <button
                onClick={() => setActiveTab('generated')}
                className={`px-5 py-3.5 border-b-2 transition whitespace-nowrap flex items-center gap-2 ${
                  activeTab === 'generated' ? 'border-amber-600 text-amber-600 bg-white' : 'border-transparent text-slate-600 hover:text-slate-900'
                }`}
              >
                <span>Generated Questions Audit</span>
                <span className="px-2 py-0.5 rounded-full text-[10px] bg-amber-100 text-amber-800 font-extrabold">
                  {generatedQuestions.length}
                </span>
              </button>
            </div>

            <div className="p-6">
              {/* INCORRECT QUESTIONS */}
              {activeTab === 'incorrect' && (
                <div className="space-y-6">
                  {incorrectQuestions.length === 0 ? (
                    <div className="text-center py-12 text-slate-500">
                      <p className="font-bold text-slate-900 text-base">Zero incorrect answers recorded.</p>

                    incorrectQuestions.map((q) => (

                          <div className="flex items-center gap-2">

                          <div className="p-3 bg-emerald-50 border border-emerald-200 rounded-lg">
                            <span className="font-bold text-emerald-800 block mb-1">Correct Answer:</span>
                            <span className="font-mono text-emerald-900 font-semibold">{q.correctAnswerString}</span>
                          </div>
                        </div>

                        <div className="space-y-1 text-xs pt-2 border-t border-slate-200">
                          {q.options.map((opt) => {
                            const isUserPicked = q.userAnswers.includes(opt.letter);
                            const isCorrectOpt = q.correctLetters.includes(opt.letter);
                            return (
                              <div
                                key={opt.letter}
                                className={`p-2.5 rounded-lg flex items-start gap-2 ${
                                  isCorrectOpt
                                    ? 'bg-emerald-100/70 text-emerald-900 font-semibold'
                                    : isUserPicked
                                    ? 'bg-red-100/70 text-red-900'
                                    : 'text-slate-600'
                                }`}
                              >
                                <span className="font-bold font-mono">{opt.letter}.</span>
                                <span>{opt.text}</span>
                              </div>
                            );
                          })}
                        </div>

                        <div className="p-4 bg-white border border-slate-200 rounded-xl text-xs leading-relaxed text-slate-700">
                          <span className="font-bold text-slate-900 block mb-1">Explanation & Rationale:</span>
                          {q.explanation}
                        </div>
                      </div>
                    ))
                  )}
                </div>
              )}

              {/* CORRECT QUESTIONS */}
              {activeTab === 'correct' && (
                <div className="space-y-6">
                  {correctQuestions.length === 0 ? (
                    <div className="text-center py-12 text-slate-500">
                      <p className="font-bold text-slate-900">No correct questions in this session.</p>
                    </div>
                  ) : (
                    correctQuestions.map((q) => (
                      <div key={q.id} className="border border-emerald-200 rounded-xl p-5 bg-emerald-50/20 space-y-4">
                        <div className="flex items-center justify-between">
                          <div className="flex items-center gap-2">
                            <span className="text-xs font-bold text-emerald-700 bg-emerald-100 px-2.5 py-0.5 rounded font-mono">
                              Q{q.examIndex}
                            </span>
                            <span className="text-xs text-slate-500 font-semibold uppercase">
                              {q.source === 'generated' ? 'Generated Fallback' : 'Source File'}
                            </span>
                          </div>
                          <span className="text-xs font-bold text-emerald-700 bg-emerald-50 px-2.5 py-0.5 rounded border border-emerald-200">
                            Correct
                          </span>
                        </div>

                        <div className="text-sm font-bold text-slate-900 leading-relaxed">
                          {q.question}
                        </div>

                        <div className="p-3 bg-emerald-50 border border-emerald-200 rounded-lg text-xs">
                          <span className="font-bold text-emerald-800 block mb-1">Confirmed Correct Answer:</span>
                          <span className="font-mono text-emerald-900 font-semibold">{q.correctAnswerString}</span>
                        </div>

                        <div className="p-3.5 bg-white border border-slate-200 rounded-xl text-xs leading-relaxed text-slate-700">
                          <span className="font-bold text-slate-900 block mb-1">Explanation & Rationale:</span>
                          {q.explanation}
                        </div>
                      </div>
                    ))
                  )}
                </div>
              )}

              {/* CATEGORIES BREAKDOWN */}
              {activeTab === 'categories' && (
                <div className="space-y-4">
                  <h3 className="text-xs font-bold uppercase tracking-wider text-slate-700 mb-2">
                    Topic Breakdown & Performance
                  </h3>
                  <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                    {categoryStats.map((cat) => (
                      <div key={cat.id} className="border border-slate-200 rounded-xl p-4 bg-slate-50">
                        <div className="flex items-center justify-between mb-1">
                          <span className="text-xs font-bold text-slate-800">{cat.name}</span>
                          <span className="text-xs font-extrabold font-mono text-slate-900">
                            {cat.correct} / {cat.total} ({cat.percentage}%)

                        </div>
                        <div className="w-full bg-slate-200 rounded-full h-2 overflow-hidden mt-2">
                          <div
                            className={`h-2 rounded-full transition-all duration-500 ${
                              cat.percentage >= 65 ? 'bg-emerald-600' : 'bg-rose-600'
                            }`}
                            style={{ width: `${cat.percentage}%` }}
                          ></div>
                        </div>
                      </div>
                    ))}
                  </div>
                </div>
              )}

              {/* GENERATED AUDIT */}
              {activeTab === 'generated' && (
                <div className="space-y-6">
                  <div className="p-4 bg-amber-50 border border-amber-200 rounded-xl text-xs text-amber-900 leading-relaxed">
                    <strong>Generated Question Audit:</strong> These questions were auto-generated by the fallback synthesizer to meet blueprint weighting requirements where file question density was insufficient.
                  </div>

                  {generatedQuestions.length === 0 ? (
                    <div className="text-center py-8 text-slate-500 text-xs font-medium">
                      All 60 questions were sourced from your uploaded question file.
                    </div>
                  ) : (
                    generatedQuestions.map((q) => (
                      <div key={q.id} className="border border-amber-200 rounded-xl p-4 bg-amber-50/30 space-y-3 text-xs">
                        <div className="flex items-center justify-between">
                          <span className="font-bold text-amber-800 bg-amber-100 px-2.5 py-0.5 rounded font-mono">
                            Generated Q{q.examIndex}
                          </span>
                          <span className="text-slate-500 uppercase font-bold">
                            Result: {q.isCorrect ? 'Correct' : 'Incorrect'}
                          </span>
                        </div>
                        <div className="text-sm font-bold text-slate-900">{q.question}</div>
                        <div className="text-slate-700">
                          <strong>Correct Answer:</strong> <span className="font-mono font-semibold">{q.correctAnswerString}</span>
                        </div>
                        <div className="p-3 bg-white rounded-lg border border-slate-200 text-slate-600 leading-relaxed">
                          {q.explanation}
                        </div>
                      </div>
                    ))
                  )}
                </div>
              )}
            </div>
          </div>
        </div>
      );
    }

    function App() {
      const { examState } = useExam();

      return (
        <div className="min-h-screen bg-slate-100 text-slate-900 flex flex-col font-sans antialiased">
          <header className="bg-slate-900 text-white border-b border-slate-800 shadow sticky top-0 z-40">
            <div className="max-w-6xl mx-auto px-4 py-3 flex items-center justify-between">
              <div className="flex items-center gap-3">
                <div className="w-8 h-8 rounded-lg bg-blue-600 flex items-center justify-center font-extrabold text-white text-sm shadow">
                  SF
                </div>
                <div>
                  <span className="text-sm font-bold tracking-tight block">ADM-201 Proctor</span>
                  <span className="text-[10px] text-slate-400 block -mt-0.5">Salesforce Administrator Exam Simulator</span>
                </div>
              </div>

              <div className="flex items-center gap-3 text-xs">
                <span className="inline-flex items-center px-2.5 py-0.5 rounded-full text-[10px] font-bold bg-slate-800 text-slate-300 border border-slate-700">
                  Deterministic Proctor Engine
                </span>
              </div>
            </div>
          </header>

          <main className="flex-1 py-8 px-4">
            {examState === EXAM_STATES.NOT_STARTED && <FileUploadScreen />}
            {examState === EXAM_STATES.CONFIRMED && <PreExamScreen />}
            {examState === EXAM_STATES.IN_PROGRESS && <ExamScreen />}
            {examState === EXAM_STATES.PAUSED && (
              <>
                <ExamScreen />
                <PauseScreen />
              </>
            )}
            {examState === EXAM_STATES.COMPLETED && <ResultsScreen />}
          </main>

          <footer className="bg-white border-t border-slate-200 py-4 text-center text-xs text-slate-500">
            <div className="max-w-6xl mx-auto px-4 flex flex-col sm:flex-row items-center justify-between gap-2">
              <span>Salesforce Certified Administrator Mock Exam Engine</span>
              <span>Aligned with Official ADM-201 Blueprint • 105 Min • 65% Pass Threshold</span>
            </div>
          </footer>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(
      <ExamProvider>
        <App />
      </ExamProvider>
    );
  </script>
</body>
</html>
